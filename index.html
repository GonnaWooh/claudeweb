<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Style Widget System</title>

    <!-- GridStack CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header with controls -->
        <div class="header">
            <h1>Android Widget System</h1>
            <div class="controls">
                <button id="addWidget" class="btn btn-primary">+ Add Widget</button>
                <button id="saveLayout" class="btn btn-success">Save Layout</button>
                <button id="clearLayout" class="btn btn-danger">Clear All</button>
                <label class="toggle">
                    <input type="checkbox" id="editMode" checked>
                    <span>Edit Mode</span>
                </label>
            </div>
        </div>

        <!-- Main Grid Container -->
        <div class="grid-stack" id="grid-stack">
            <!-- Widgets will be added here dynamically -->
        </div>
    </div>

    <!-- GridStack JS -->
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack-all.js"></script>

    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
